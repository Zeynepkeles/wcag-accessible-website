<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Harbor Community Library</title>
  <meta name="description" content="Contact Harbor Community Library.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <p class="logo">Harbor Community Library</p>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="programs.html">Programs</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Contact Us</h1>
    <p class="lead">Fields marked with an asterisk (*) are required.</p>

    <p id="form-status" role="status" aria-live="polite" class="status"></p>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="name">Full name *</label>
        <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-error">
        <span id="name-error" class="error"></span>
      </div>

      <div class="field">
        <label for="email">Email address *</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
        <span id="email-error" class="error"></span>
      </div>

      <div class="field">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
        <span id="message-error" class="error"></span>
      </div>

      <button type="submit" class="btn">Send message</button>
    </form>

    <h2>Opening hours</h2>
    <address>
      123 Harbor Street, Wilmington, DE<br>
      Monday to Friday: 9:00 AM to 6:00 PM
    </address>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Harbor Community Library (demo project). <a href="index.html">Back to home</a></p>
    </div>
  </footer>
</body>
</html>
